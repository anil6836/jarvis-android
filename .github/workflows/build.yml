name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          body: ఫోన్‌లో Jarvis.apk డౌన్‌లోడ్ చేసి ఇన్‌స్టాల్ చేయండి.
          files: Jarvis.apk
          make_latest: true
