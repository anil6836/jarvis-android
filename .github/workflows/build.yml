name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Save build log when the build fails
        if: failure()
        shell: bash
        run: |
          tail -n 600 build.log > /tmp/last-build.log || true
          git config user.name "jarvis-build"
          git config user.email "jarvis-build@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/last-build.log last-build.log
          git add -f last-build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          body: ఫోన్‌లో Jarvis.apk డౌన్‌లోడ్ చేసి ఇన్‌స్టాల్ చేయండి.
          files: Jarvis.apk
          make_latest: true
