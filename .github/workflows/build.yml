name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download "Hey Jarvis" wake word models (openWakeWord)
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fsSL --retry 3 -o "app/src/main/assets/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          ls -la app/src/main/assets

      - name: Download the cough / sneeze sound model (YAMNet)
        shell: bash
        run: |
          # Not fatal: without it the build still works, only cough detection is off.
          curl -fsSL --retry 3 -o app/src/main/assets/yamnet.tflite "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/latest/yamnet.tflite" \
            || curl -fsSL --retry 3 -o app/src/main/assets/yamnet.tflite "https://storage.googleapis.com/tfhub-lite-models/google/lite-model/yamnet/classification/tflite/1.tflite" \
            || { rm -f app/src/main/assets/yamnet.tflite; echo "::warning::YAMNet model not downloaded; cough detection is off in this build"; }
          ls -la app/src/main/assets

      - name: Download the face memory model (FaceNet), published next to the APK
        shell: bash
        run: |
          # Not fatal: the phone also knows the model's original home. Checked against its SHA-256 here and on the phone.
          curl -fsSL --retry 3 -o facenet.tflite "https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite" \
            && echo "d7c1f7f130376982c7004920ddc41925ac2e5aecf6522f476c8bbb3669db7013  facenet.tflite" | sha256sum -c - \
            || { rm -f facenet.tflite; echo "::warning::FaceNet model not downloaded; this release has no facenet.tflite"; }

      - name: Download the Telugu font for the watch app (if the watch has no Telugu letters of its own)
        shell: bash
        run: |
          # Not fatal: the watch's own font is used when it has Telugu; this one is only a backup. SIL Open Font License.
          mkdir -p wear/src/main/assets
          F=wear/src/main/assets/NotoSansTelugu-Regular.ttf
          curl -fsSL --retry 3 -o "$F" "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansTelugu/hinted/ttf/NotoSansTelugu-Regular.ttf" \
            || curl -fsSL --retry 3 -o "$F" "https://github.com/google/fonts/raw/main/ofl/notosanstelugu/NotoSansTelugu%5Bwdth,wght%5D.ttf" \
            || rm -f "$F"
          if [ -f "$F" ] && ! head -c 4 "$F" | od -An -tx1 | grep -Eq "00 01 00 00|74 72 75 65|4f 54 54 4f"; then rm -f "$F"; fi
          if [ -f "$F" ]; then
            curl -fsSL --retry 3 -o wear/src/main/assets/OFL-NotoSansTelugu.txt "https://github.com/notofonts/telugu/raw/main/OFL.txt" \
              || echo "Noto Sans Telugu: Copyright 2022 The Noto Project Authors. Licensed under the SIL Open Font License 1.1 (https://openfontlicense.org)." > wear/src/main/assets/OFL-NotoSansTelugu.txt
          else
            echo "::warning::Telugu font not downloaded; the watch app uses the watch's own font"
          fi
          ls -la wear/src/main/assets

      - name: Unlock the signing key
        shell: bash
        env:
          JARVIS_KEY_PASS: ${{ secrets.JARVIS_KEY_PASS }}
        run: |
          if [ -z "$JARVIS_KEY_PASS" ]; then echo "::error::Add the JARVIS_KEY_PASS secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/jarvis.keystore.enc -out app/jarvis.keystore -pass env:JARVIS_KEY_PASS

      - name: Build signed APK
        shell: bash
        env:
          JARVIS_KEY_PASS: ${{ secrets.JARVIS_KEY_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Save build log when the build fails
        if: failure()
        shell: bash
        run: |
          tail -n 600 build.log > /tmp/last-build.log || true
          git config user.name "jarvis-build"
          git config user.email "jarvis-build@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/last-build.log last-build.log
          git add -f last-build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Jarvis.apk
          cp wear/build/outputs/apk/release/wear-release.apk Jarvis-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: |
            Jarvis.apk
            Jarvis-watch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          body: |
            ఫోన్‌లో Jarvis.apk డౌన్‌లోడ్ చేసి, పాత యాప్ మీదే ఇన్‌స్టాల్ (Update) చేయండి.

            Jarvis-watch.apk: Galaxy Watch కోసం Jarvis (వాచ్‌లో Bugjaeger తో ఇన్‌స్టాల్ చేయండి; స్టెప్స్ ఫోన్ Settings → ⌚ వాచ్ లో). ఫోన్ యాప్, వాచ్ యాప్ ఒకే వెర్షన్ ఉంటే మంచిది.

            facenet.tflite: the FaceNet model Jarvis downloads once to remember faces (TFLite conversion by shubham0204, Apache-2.0; weights from nyoki-mtl/keras-facenet, MIT).
          files: |
            Jarvis.apk
            Jarvis-watch.apk
            facenet.tflite
          make_latest: true
