name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download "Hey Jarvis" wake word models (openWakeWord)
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fsSL --retry 3 -o "app/src/main/assets/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          ls -la app/src/main/assets

      - name: Check that the "Jarvis" word is in the Vosk vocabulary
        shell: bash
        run: |
          echo "ఫోన్‌లో Jarvis.apk డౌన్‌లోడ్ చేసి ఇన్‌స్టాల్ చేయండి." > release-notes.md
          if curl -fsSL --retry 2 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip; then
            mkdir -p /tmp/vosk && unzip -q /tmp/vosk.zip -d /tmp/vosk
            W=$(find /tmp/vosk -name words.txt | head -1)
            if [ -n "$W" ] && grep -qiw "jarvis" "$W"; then echo "VOSK_JARVIS=yes ($W)" >> release-notes.md; else echo "VOSK_JARVIS=no (${W:-no words.txt})" >> release-notes.md; fi
            (cd /tmp/vosk && find . -maxdepth 3 | head -40) >> release-notes.md
          else
            echo "VOSK_JARVIS=unknown (download failed)" >> release-notes.md
          fi
          cat release-notes.md

      - name: Build signed APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Save build log when the build fails
        if: failure()
        shell: bash
        run: |
          tail -n 600 build.log > /tmp/last-build.log || true
          git config user.name "jarvis-build"
          git config user.email "jarvis-build@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/last-build.log last-build.log
          git add -f last-build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: Jarvis.apk
          make_latest: true
