name: Move version tags to cleaned history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point each vX tag at its cleaned commit (old commits held the signing key)
