pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // only for Tesseract4Android (the library's free on-phone Telugu page reader) and usb-serial-for-android (🌱 the
        // plant board's ESP32 over a USB OTG cable)
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'cz.adaptech.tesseract4android'
                includeGroup 'com.github.mik3y'
            }
        }
    }
}
rootProject.name = "Jarvis"
include ':app'
include ':wear'
include ':face'
