plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.anil.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anil.jarvis'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        ndk {
            // Most Android phones; keeps the download small.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file('jarvis.keystore')
            // decrypted by the build from jarvis.keystore.enc with the JARVIS_KEY_PASS secret
            storePassword System.getenv('JARVIS_KEY_PASS') ?: ''
            keyAlias 'jarvis'
            keyPassword System.getenv('JARVIS_KEY_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // the cough model is memory-mapped straight from the APK
        noCompress 'tflite'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // On-device "Hey Jarvis" wake word (openWakeWord models run with ONNX Runtime)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // WebSocket for the live (real-time) voice conversation
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    // Document scanner (edges, straightening, cleaning, multi-page PDF) from Google Play services
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // Finding faces in the front camera picture for Jarvis's face (Google Play services, on the phone)
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    // Offline "Jarvis" single-word detection (model downloaded on the phone the first time)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // Hearing a cough / sneeze on the phone (Google's YAMNet sound model, downloaded by the build)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // Talking with the Jarvis watch app (Galaxy Watch) over its Bluetooth link (Wear Data Layer messages)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    // Phase 5 without internet: English print read on the phone (O30, the model is inside the app) and
    // English -> Telugu translation (O29, Google's pack downloaded once when he taps it in Settings)
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:translate:17.0.2'
}
