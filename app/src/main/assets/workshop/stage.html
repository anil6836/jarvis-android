<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 🛠️ The sealed stage. AI-written part code runs here: no network (connect-src 'none'), no frames, no workers, no forms. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://appassets.androidplatform.net 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: radial-gradient(ellipse 70% 60% at 50% 46%, #2b3342 0%, #151a23 46%, #07080b 100%); }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #lines line { stroke: rgba(79, 210, 255, 0.55); stroke-width: 0.8; }
  #lines circle { fill: #4fd2ff; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis;
        font: 500 11px/1.3 system-ui, "Noto Sans Telugu", sans-serif; color: #e8f4ff; background: rgba(8, 14, 20, 0.72);
        border: 1px solid rgba(79, 210, 255, 0.4); border-radius: 7px; padding: 2px 6px; pointer-events: auto; }
  /* 🗑️ the bin: pieces carried here by his hand */
  #bin { position: fixed; right: 14px; bottom: 120px; width: 58px; height: 58px; border-radius: 50%; display: none;
         align-items: center; justify-content: center; font-size: 27px; background: rgba(8, 14, 20, 0.86);
         border: 1.5px solid rgba(79, 210, 255, 0.6); transition: transform 0.15s, border-color 0.15s, background 0.15s; user-select: none; }
  #bin.hot { transform: scale(1.3); border-color: #9be7ff; background: rgba(42, 168, 255, 0.35); }
  #binN { position: absolute; top: -4px; right: -4px; min-width: 18px; padding: 0 4px; border-radius: 9px; background: #4fd2ff;
          color: #04131a; font: 700 11px/18px system-ui, sans-serif; text-align: center; }
  #binN:empty { display: none; }
  /* 📏 the tape's number */
  .lb.tape { position: fixed; pointer-events: none; font-size: 13px; font-weight: 600; color: #fff3c4; border-color: rgba(255, 211, 77, 0.75); max-width: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"><svg id="lines"></svg></div>
<div id="bin">🗑️<b id="binN"></b></div>
<script type="module" src="stage.js"></script>
</body>
</html>
