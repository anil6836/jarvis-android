<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 🛠️ The sealed stage. AI-written part code runs here: no network (connect-src 'none'), no frames, no workers, no forms. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://appassets.androidplatform.net 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: radial-gradient(ellipse 70% 60% at 50% 46%, #2b3342 0%, #151a23 46%, #07080b 100%); }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #lines line { stroke: rgba(79, 210, 255, 0.55); stroke-width: 0.8; }
  #lines circle { fill: #4fd2ff; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis;
        font: 500 11px/1.3 system-ui, "Noto Sans Telugu", sans-serif; color: #e8f4ff; background: rgba(8, 14, 20, 0.72);
        border: 1px solid rgba(79, 210, 255, 0.4); border-radius: 7px; padding: 2px 6px; pointer-events: auto; }
  /* 🗑️ the bin: pieces carried here by his hand */
  #bin { position: fixed; right: 14px; bottom: 120px; width: 58px; height: 58px; border-radius: 50%; display: none;
         align-items: center; justify-content: center; font-size: 27px; background: rgba(8, 14, 20, 0.86);
         border: 1.5px solid rgba(79, 210, 255, 0.6); transition: transform 0.15s, border-color 0.15s, background 0.15s; user-select: none; }
  #bin.hot { transform: scale(1.3); border-color: #9be7ff; background: rgba(42, 168, 255, 0.35); }
  #binN { position: absolute; top: -4px; right: -4px; min-width: 18px; padding: 0 4px; border-radius: 9px; background: #4fd2ff;
          color: #04131a; font: 700 11px/18px system-ui, sans-serif; text-align: center; }
  #binN:empty { display: none; }
  /* 📏 the tape's number */
  .lb.tape { position: fixed; pointer-events: none; font-size: 13px; font-weight: 600; color: #fff3c4; border-color: rgba(255, 211, 77, 0.75); max-width: none; }
  /* ⚡ the power gauge, 🌡️ the hottest parts, 🧾 live numbers, ✋ his fingertip */
  #gauge { position: fixed; left: 12px; top: 30%; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0;
           transition: opacity 0.4s; pointer-events: none; font: 600 11px/1.25 system-ui, "Noto Sans Telugu", sans-serif; color: #e8f4ff; }
  #gauge .bar { position: relative; width: 14px; height: 116px; border-radius: 8px; background: rgba(8, 14, 20, 0.72); border: 1px solid rgba(79, 210, 255, 0.45); overflow: hidden; }
  #gauge i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(to top, #2aa8ff, #8fe9ff); }
  #gauge u { position: absolute; left: 0; right: 0; height: 2px; background: #ffffff; }
  #gauge.over i { background: linear-gradient(to top, #ff7a2b, #ff2d2d); }
  #gauge.over b { color: #ff8a6a; }
  #gauge em { font-style: normal; max-width: 74px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #heatTags { position: fixed; inset: 0; pointer-events: none; }
  .ht { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 11px/1.3 system-ui, "Noto Sans Telugu", sans-serif; color: #fff;
        background: rgba(24, 9, 4, 0.74); border: 1px solid rgba(255, 138, 61, 0.75); border-radius: 7px; padding: 1px 6px; }
  #hud { position: fixed; left: 10px; top: 60px; display: none; pointer-events: none; font: 500 11px/1.5 system-ui, "Noto Sans Telugu", sans-serif;
         color: #e8f4ff; background: rgba(8, 14, 20, 0.74); border: 1px solid rgba(79, 210, 255, 0.35); border-radius: 9px; padding: 5px 9px; min-width: 128px; }
  #hud div { display: flex; justify-content: space-between; gap: 12px; }
  #hud span { color: #9fb8c8; }
  #tip { position: fixed; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; display: none; pointer-events: none;
         background: radial-gradient(circle, #e9fbff 0%, #4fd2ff 45%, rgba(79, 210, 255, 0) 72%); }
  #tip.on { width: 28px; height: 28px; background: radial-gradient(circle, #ffffff 0%, #7fe6ff 40%, rgba(79, 210, 255, 0) 72%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"><svg id="lines"></svg></div>
<div id="bin">🗑️<b id="binN"></b></div>
<div id="gauge"><em>⚡</em><div class="bar"><i></i><u></u></div><b>0%</b></div>
<div id="heatTags"></div>
<div id="hud"></div>
<div id="tip"></div>
<script type="module" src="stage.js"></script>
</body>
</html>
