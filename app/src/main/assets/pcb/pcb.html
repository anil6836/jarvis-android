<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<!-- 🔌 Jarvis PCB studio. Only the studio's own scripts run here; designs (and the AI's answers) are data, every word goes in with textContent. No network. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root { --bg: #07080b; --panel: #0e141c; --card: #121a24; --line: #233142; --text: #dceef5; --muted: #88a5b3; --faint: #557584;
          --cyan: #74e4ff; --cyan2: #1e6a80; --gold: #f2b24c; --green: #6be3a4; --red: #ff6b6b; --amber: #ffc861; --fr4: #16391f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Noto Sans Telugu", system-ui, "Noto Color Emoji", sans-serif;
               font-size: 15px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--panel); }
  #top .back { font-size: 20px; padding: 6px 8px; color: var(--muted); }
  #top .name { flex: 1; min-width: 0; font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #top .name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  #state { flex: none; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  #state.ok { border-color: var(--green); color: var(--green); }
  #state.bad { border-color: var(--red); color: var(--red); }
  #tabs { position: absolute; left: 0; right: 0; top: 46px; display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); font-size: 14px; white-space: nowrap; }
  .tab.on { background: var(--cyan); color: #04131a; border-color: var(--cyan); font-weight: 600; }
  .tab.off { opacity: .45; }
  main { position: absolute; top: 93px; left: 0; right: 0; bottom: 0; }
  section { position: absolute; inset: 0; display: none; }
  section.on { display: block; }
  section.scroll { overflow-y: auto; padding: 10px 12px 90px; -webkit-overflow-scrolling: touch; }
  canvas.view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .tools { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 8px; overflow-x: auto; background: linear-gradient(to top, rgba(7,8,11,.96), rgba(7,8,11,0)); scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .tool { flex: none; background: rgba(18,26,36,.95); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px; white-space: nowrap; color: var(--text); font-family: inherit; }
  .tool.on { border-color: var(--cyan); color: var(--cyan); }
  .tool.main { background: var(--cyan); color: #04131a; border-color: var(--cyan); font-weight: 600; }
  .chips { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .chip { pointer-events: auto; background: rgba(14,20,28,.88); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
  .chip.ok { border-color: var(--green); color: var(--green); }
  .chip.bad { border-color: var(--red); color: var(--red); }
  .chip.warn { border-color: var(--amber); color: var(--amber); }
  #sel { position: absolute; left: 8px; right: 8px; bottom: 60px; display: none; background: rgba(18,26,36,.97); border: 1px solid var(--cyan2); border-radius: 14px; padding: 8px 10px; }
  #sel .t { font-weight: 600; } #sel .m { color: var(--muted); font-size: 13px; line-height: 1.45; }
  #sel .row { margin: 6px 0 0; }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; background: var(--panel); border-top: 1px solid var(--cyan2); border-radius: 18px 18px 0 0;
           padding: 8px 14px 22px; overflow-y: auto; transform: translateY(105%); transition: transform .18s ease-out; z-index: 6; }
  #sheet.on { transform: none; }
  #sheet .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 8px; }
  h2 { font-size: 18px; margin: 4px 0 8px; }
  h3 { font-size: 15.5px; margin: 16px 0 6px; color: var(--cyan); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
  .card.tap:active { border-color: var(--cyan); }
  .muted { color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .row .k { flex: 1; min-width: 110px; }
  .btn { background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); border-radius: 11px; padding: 8px 12px; font: inherit; font-size: 14px; }
  .btn.main { background: var(--cyan); color: #04131a; border-color: var(--cyan); font-weight: 600; }
  .btn.warn { border-color: var(--amber); color: var(--amber); }
  .btn.bad { border-color: var(--red); color: var(--red); }
  .btn.small { padding: 5px 10px; min-width: 34px; }
  .btn.on { border-color: var(--cyan); color: var(--cyan); }
  .val { min-width: 64px; text-align: center; font-weight: 600; }
  input, select { background: #0a1018; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font: inherit; font-size: 14.5px; }
  input[type=number] { width: 88px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td, th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .proj { display: flex; gap: 10px; align-items: center; }
  .proj canvas { flex: none; width: 92px; height: 66px; border-radius: 8px; background: #0b1610; }
  .proj .t { font-weight: 600; } .proj .d { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
  .tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 4px 4px 0 0; }
  .item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); line-height: 1.5; font-size: 14px; }
  .item .i { flex: none; width: 22px; text-align: center; }
  .item .x { flex: 1; }
  .item .f { color: var(--muted); font-size: 13px; }
  .err { color: var(--red); } .warnc { color: var(--amber); } .okc { color: var(--green); } .cy { color: var(--cyan); }
  .bands { display: flex; gap: 3px; align-items: center; margin: 6px 0; }
  .bands i { display: inline-block; width: 14px; height: 26px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
  .bands .body { background: #d8c49a; padding: 4px 10px; border-radius: 10px; display: flex; gap: 6px; }
  .step { padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.55; font-size: 14px; }
  .big { font-size: 22px; font-weight: 700; }
  .num { text-align: right; white-space: nowrap; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: inline-block; }
  .swatch.on { border-color: var(--cyan); }
  #toast { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); background: rgba(18,26,36,.97); border: 1px solid var(--cyan2); color: var(--text);
           border-radius: 12px; padding: 9px 14px; font-size: 14px; max-width: 92%; display: none; z-index: 9; text-align: center; line-height: 1.45; }
  #v3d { position: absolute; inset: 0; }
  #v3d canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #v3dinfo { position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; display: flex; gap: 6px; flex-wrap: wrap; }
  .soon { opacity: .75; }
  textarea { width: 100%; background: #0a1018; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 15px;
             line-height: 1.5; resize: vertical; -webkit-user-select: text; user-select: text; margin: 6px 0 2px; }
  textarea:focus { outline: none; border-color: var(--cyan); }
  #mic { flex: none; font-size: 17px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
  #mic.on { background: var(--cyan); color: #04131a; border-color: var(--cyan); }
  #aibar { position: absolute; left: 8px; right: 8px; top: 99px; z-index: 7; display: none; background: rgba(18,26,36,.97); border: 1px solid var(--gold);
           border-radius: 14px; padding: 8px 10px; align-items: center; gap: 8px; }
  #aibar.on { display: flex; }
  #aibar .x { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.45; }
  .card.idea { border-color: var(--cyan2); }
  .card.idea .t { font-weight: 600; }
  .ex { display: inline-block; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); margin: 5px 5px 0 0; color: var(--muted); }
  .ex:active { border-color: var(--cyan); color: var(--cyan); }
  .photo { display: flex; gap: 10px; align-items: center; margin: 8px 0 2px; }
  .photo img { width: 96px; height: auto; border-radius: 8px; border: 1px solid var(--line); }
  .quote { margin-top: 8px; font-size: 13.5px; line-height: 1.5; }
  .quote .m { color: var(--gold); font-weight: 600; }
  .btn:disabled { opacity: .45; }
  .chip.tap { cursor: pointer; }
  .ver .t { font-weight: 600; } .ver .d { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 2px; }
  .ver.named { border-color: var(--cyan2); }
  .reading { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 14px; margin: 6px 0; }
  .reading .k { color: var(--muted); }
</style>
</head>
<body>
<div id="top"><span class="back" id="close">←</span><div class="name" id="name">🔌 PCB స్టూడియో<small id="sub">నిజమైన PCB బోర్డ్‌లు</small></div><span id="mic">🎙️</span><span id="state">—</span></div>
<div id="tabs">
  <span class="tab on" data-tab="home">📚 బోర్డ్‌లు</span>
  <span class="tab" data-tab="sch">📐 స్కీమాటిక్</span>
  <span class="tab" data-tab="pcb">🧩 PCB</span>
  <span class="tab" data-tab="drc">✅ చెక్</span>
  <span class="tab" data-tab="sim">⚡ నడిపించు</span>
  <span class="tab" data-tab="d3">🧊 3D</span>
  <span class="tab" data-tab="fab">🏭 ఫ్యాక్టరీ</span>
  <span class="tab" data-tab="calc">🧮 లెక్కలు</span>
</div>
<main>
  <section id="home" class="scroll on"></section>
  <section id="sch"><canvas class="view" id="schcv"></canvas><div class="chips" id="schchips"></div><div class="tools" id="schtools"></div></section>
  <section id="pcb"><canvas class="view" id="pcbcv"></canvas><div class="chips" id="pcbchips"></div><div id="sel"></div><div class="tools" id="pcbtools"></div></section>
  <section id="drc" class="scroll"></section>
  <section id="sim"><canvas class="view" id="simcv"></canvas><div class="chips" id="simchips"></div><div class="tools" id="simtools"></div></section>
  <section id="d3"><div id="v3d"></div><div id="v3dinfo"></div><div class="tools" id="d3tools"></div></section>
  <section id="fab" class="scroll"></section>
  <section id="calc" class="scroll"></section>
  <div id="sheet"></div>
  <div id="aibar"></div>
</main>
<div id="toast"></div>
<script src="pcbparts.js"></script>
<script src="pcbcore.js"></script>
<script src="pcbfab.js"></script>
<script src="pcbprojects.js"></script>
<script src="pcbbuy.js"></script>
<script src="pcbai.js"></script>
<script src="pcbsim.js"></script>
<script src="pcbkicad.js"></script>
<script src="pcb.js"></script>
</body>
</html>
