<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<!-- 📚 Jarvis గ్రంథాలయం. Only the library's own scripts run here; book text and search results are data, shown with textContent only.
     No network in this page: the phone fetches free books on his taps and sends them in. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root { --bg: #120c08; --panel: #1d140d; --card: #241a12; --line: #4a3622; --text: #f3e6d0; --muted: #c2a888; --faint: #8a7058;
          --gold: #e8c26a; --gold2: #a8822e; --green: #8fd6a0; --red: #ff8a7a; --blue: #9cc8ff; --paper: #f5ecd8; --ink: #2a1d12; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Noto Sans Telugu", system-ui, "Noto Color Emoji", sans-serif;
               font-size: 15px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
  button:active { transform: scale(.97); }
  button.gold { background: var(--gold); color: #2a1a06; border-color: var(--gold); font-weight: 600; }
  button.wide { width: 100%; border-radius: 14px; padding: 11px 12px; text-align: left; margin: 4px 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #top { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 8px 4px;
         background: linear-gradient(180deg, rgba(18,12,8,.96) 70%, rgba(18,12,8,.0)); z-index: 3; }
  /* (two rows, like the reader: ✕ the name 🎙️ / 🕰️ 📊 ✨ 🔍 ➕ — nothing wraps onto the rack names under it, even with the phone's big letters) */
  #top .t1, #top .t2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #top .t2 button { flex: 1 1 0; min-width: 44px; max-width: 64px; padding: 6px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #top .t2 #bView { flex: 3 1 auto; max-width: none; padding: 6px 12px; }
  #top button { white-space: nowrap; }
  #ttl { flex: 1; font-size: 17px; font-weight: 700; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #top button { padding: 6px 11px; background: rgba(36,26,18,.9); }
  #chips { position: absolute; top: 96px; left: 0; right: 0; display: flex; gap: 6px; padding: 4px 8px; overflow-x: auto; z-index: 3; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(36,26,18,.88); font-size: 13.5px; white-space: nowrap; }
  .chip.on { background: var(--gold); color: #2a1a06; border-color: var(--gold); font-weight: 600; }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 12.5px; pointer-events: none; z-index: 2;
          text-shadow: 0 1px 3px #000; }
  #nowbar { position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 16px;
            background: rgba(29,20,13,.95); border: 1px solid var(--gold2); z-index: 4; }
  #nowbar .t { flex: 1; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowbar button { padding: 5px 10px; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%; overflow-y: auto; background: var(--panel); border-top: 2px solid var(--gold2);
           border-radius: 18px 18px 0 0; padding: 14px 14px 22px; z-index: 10; box-shadow: 0 -8px 30px rgba(0,0,0,.6); -webkit-overflow-scrolling: touch; }
  .sheet h2 { margin: 0 0 2px; font-size: 19px; color: var(--gold); line-height: 1.35; }
  .sheet .sub { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .sheet p { margin: 6px 0; line-height: 1.55; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pill { display: inline-block; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { border-color: #3f7a52; color: var(--green); }
  .pill.lock { border-color: #7a3f3f; color: var(--red); }
  .pill.web { border-color: #3f5a7a; color: var(--blue); }
  .x { position: absolute; top: 10px; right: 12px; padding: 4px 10px; }
  .panel { position: absolute; inset: 0; background: var(--bg); z-index: 8; display: flex; flex-direction: column; }
  #mapp, #trs { z-index: 9; } /* (opened from the reading screen: over it) */
  .panel header { display: flex; align-items: center; gap: 6px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .panel header .h { flex: 1; font-weight: 700; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .body { flex: 1; overflow-y: auto; padding: 10px 12px 90px; -webkit-overflow-scrolling: touch; }
  #q { flex: 1; font: inherit; font-size: 16px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
  .res { display: flex; gap: 10px; padding: 10px; margin: 8px 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .res .cv { flex: none; width: 54px; height: 80px; border-radius: 4px; background: #3a2a1c; overflow: hidden; display: flex; align-items: center; justify-content: center;
             font-size: 22px; }
  .res .cv img { width: 100%; height: 100%; object-fit: cover; }
  .res .i { flex: 1; min-width: 0; }
  .res .t1 { font-weight: 700; line-height: 1.35; }
  .res .t2 { color: var(--muted); font-size: 13.5px; margin: 2px 0 4px; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .prog { color: var(--gold); font-size: 13.5px; margin: 6px 0; }
  /* reading screen */
  #reader { background: #f3ead6; color: var(--ink); }
  #reader.night { background: #15110c; color: #e9dcc4; }
  #reader header { background: #e6d8b8; border-color: #cbb68c; color: var(--ink); }
  #reader.night header { background: #221a12; border-color: #4a3622; color: #e9dcc4; }
  #reader header button, #reader footer button { color: inherit; background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.15); }
  #reader.night header button, #reader.night footer button { background: rgba(255,255,255,.06); border-color: #4a3622; }
  #reader .h { color: #6a3f12; }
  #reader.night .h { color: var(--gold); }
  #chap { font: inherit; font-size: 14px; color: inherit; background: rgba(255,255,255,.35); border: 1px solid rgba(0,0,0,.2); border-radius: 10px; padding: 7px 6px; }
  /* (two rows: the book's name in full with 🎙️; the chapter with A− A+ 🌙 under it: nothing pushed off the screen) */
  #reader #rHead { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 8px 8px; }
  #rHead .r1, #rHead .r2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #rHead .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; padding: 0 2px; }
  #rTitle { font-weight: 700; font-size: 17px; line-height: 1.22; color: #6b3f12; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; word-break: break-word; }
  #rSub { font-size: 12.5px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reader.night #rTitle { color: #f0c977; }
  #rHead #chap { flex: 1; min-width: 0; }
  #rHead .r2 button { flex: none; min-width: 46px; padding: 7px 10px; }
  #rHead .r1 button { flex: none; }
  #reader #rMic { min-width: 46px; background: rgba(201,162,78,.22); border-color: #b58a3a; }
  #reader.night #chap { background: rgba(255,255,255,.05); border-color: #4a3622; }
  #reader.night #chap option { background: #221a12; }
  #modes { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: inherit; border-bottom: 1px solid rgba(0,0,0,.12); scrollbar-width: none; }
  #modes .chip, #pairs .chip { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.18); color: inherit; }
  #reader.night #modes .chip, #reader.night #pairs .chip { background: rgba(255,255,255,.06); border-color: #4a3622; }
  #modes .chip.on, #pairs .chip.on { background: #8a5a1c; color: #fff8ea; border-color: #8a5a1c; }
  #pairs { display: flex; gap: 6px; align-items: center; padding: 4px 8px 6px; overflow-x: auto; border-bottom: 1px solid rgba(0,0,0,.12); scrollbar-width: none; }
  #pairs .pl { font-size: 13px; opacity: .75; white-space: nowrap; }
  #pairs .chip { padding: 4px 10px; font-size: 13px; }
  #text .note { font-family: system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; padding: 8px 10px; margin: 2px 0 10px; border: 1px dashed #b08a4a; border-radius: 10px; }
  #text .note button { margin-left: 4px; padding: 4px 11px; color: inherit; background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.22); }
  #reader.night #text .note button { background: rgba(255,255,255,.06); border-color: #4a3622; }
  #text { font-family: "Noto Serif Telugu", "Noto Sans Telugu", Georgia, serif; line-height: 1.7; -webkit-user-select: text; user-select: text; }
  #text .p { padding: 6px 8px; margin: 2px -8px; border-radius: 8px; }
  #text .p.now { background: rgba(232,194,106,.45); }
  #reader.night #text .p.now { background: rgba(168,130,46,.35); }
  #text .te { color: #5a3a12; display: block; margin-top: 3px; }
  #reader.night #text .te { color: #e8c26a; }
  #text .wait { opacity: .45; }
  #reader footer { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 8px;
                   background: inherit; border-top: 1px solid rgba(0,0,0,.15); }
  #reader footer button { white-space: nowrap; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; padding: 7px 9px; }
  #reader footer { gap: 4px; }
  #bubble { position: absolute; z-index: 11; background: #2a1d12; color: #f6e9cf; padding: 8px 11px; border-radius: 12px; font-size: 14px; max-width: 80vw;
            box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  #toast { position: absolute; left: 12px; right: 12px; top: 142px; z-index: 12; text-align: center; pointer-events: none; }
  #toast span { display: inline-block; background: rgba(29,20,13,.96); border: 1px solid var(--gold2); border-radius: 14px; padding: 9px 13px; font-size: 14px;
                line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  input.f, select.f { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                      padding: 8px 10px; margin: 3px 0 8px; }
  label.l { color: var(--muted); font-size: 13px; }
  .radio { display: block; padding: 8px 10px; margin: 4px 0; border: 1px solid var(--line); border-radius: 12px; }
  .radio.on { border-color: var(--gold); background: rgba(232,194,106,.12); }
  .mlist { max-height: 36vh; overflow-y: auto; margin: 6px 0 4px; border-top: 1px solid var(--line); }
  .mlist button.wide { display: block; border-radius: 12px; padding: 9px 11px; margin: 5px 0; }
  .mlist button.wide.on { border-color: var(--gold); background: rgba(232,194,106,.12); }
  .mlist .mid { display: block; font-size: 14.5px; word-break: break-all; }
  .mlist .meta { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mlist .r { float: right; margin-left: 8px; color: var(--gold); font-weight: 700; font-size: 14.5px; }
  .mlist .r.guess { color: var(--muted); font-weight: 400; }
  /* ✨ AI Telugu: the live bar, the translations page */
  #aibar { position: absolute; left: 8px; right: 8px; top: 142px; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 11px;
           border-radius: 14px; background: rgba(29,20,13,.95); border: 1px solid var(--gold2); font-size: 13px; }
  #aibar .t, #rAi .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #aibar button, #rAi button { padding: 4px 10px; font-size: 13px; }
  .bar { position: relative; height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 4px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 99px; }
  #aibar .bar { position: absolute; left: 11px; right: 11px; bottom: 2px; height: 2px; margin: 0; }
  #rAi { display: flex; align-items: center; gap: 8px; padding: 5px 8px; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,.12); background: rgba(232,194,106,.18); }
  #reader.night #rAi { background: rgba(168,130,46,.16); }
  #rAi button { color: inherit; background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.2); }
  #reader.night #rAi button { background: rgba(255,255,255,.06); border-color: #4a3622; }
  .tsum { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 2px 0 10px; }
  .trow { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0; background: var(--card); }
  .trow.run { border-color: var(--gold2); }
  .trow h3 { margin: 0; font-size: 16px; color: var(--text); line-height: 1.35; }
  .trow .n { font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .trow .live { font-size: 13.5px; color: var(--gold); margin-top: 4px; }
  .trow .row { margin: 8px 0 0; }
  .trow .row button { padding: 6px 11px; font-size: 13.5px; }
  /* 📊 నా చదువు, 🧰 the reader's tools, 🗺️ the people map, 🕰️ the hall */
  #tools { display: flex; gap: 6px; padding: 5px 8px; overflow-x: auto; border-bottom: 1px solid rgba(0,0,0,.12); scrollbar-width: none; }
  #tools .chip { padding: 4px 10px; font-size: 13px; background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.18); color: inherit; }
  #reader.night #tools .chip { background: rgba(255,255,255,.06); border-color: #4a3622; }
  #text .p.hl { background: rgba(255,214,102,.42); box-shadow: inset 3px 0 0 #d99a1c; }
  #reader.night #text .p.hl { background: rgba(160,120,30,.32); }
  #text .p.now.hl { background: rgba(232,170,60,.55); }
  #text .mnote { display: block; margin-top: 4px; font-family: system-ui, sans-serif; font-size: 13.5px; font-style: italic; opacity: .85; }
  .tbox { white-space: pre-wrap; line-height: 1.65; font-size: 15.5px; margin: 8px 0; font-family: "Noto Sans Telugu", system-ui, sans-serif; }
  .tbox.live { opacity: .85; }
  textarea.f { width: 100%; min-height: 70px; font: inherit; font-size: 15px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 4px 0 6px; resize: vertical; }
  .qa { border-top: 1px solid var(--line); padding: 8px 0; }
  .qa .q { color: var(--gold); font-weight: 600; }
  .qa .a { white-space: pre-wrap; line-height: 1.6; margin-top: 4px; }
  .quiz .opt { display: block; width: 100%; text-align: left; border-radius: 12px; margin: 5px 0; padding: 10px 12px; }
  .quiz .opt.right { border-color: var(--green); background: rgba(143,214,160,.16); }
  .quiz .opt.wrong { border-color: var(--red); background: rgba(255,138,122,.14); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin: 10px 0 4px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--muted); }
  .bars .b i { display: block; width: 100%; background: var(--gold); border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .bars .b span { margin-top: 3px; white-space: nowrap; }
  .bars .b em { font-style: normal; color: var(--text); font-size: 11px; margin-bottom: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 8px; text-align: center; }
  .tile b { display: block; font-size: 21px; color: var(--gold); }
  .tile span { font-size: 12px; color: var(--muted); }
  .sec2 { margin: 18px 0 6px; font-size: 17px; color: var(--gold); font-weight: 700; }
  .mk { border-left: 3px solid #d99a1c; padding: 4px 0 4px 10px; margin: 8px 0; }
  .mk .mx { line-height: 1.5; }
  .mk .te { color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .mk .n { font-style: italic; margin-top: 3px; }
  .sug { display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid var(--line); padding: 8px 0; }
  .sug .w { flex: 1; }
  .sug .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chk { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .chk input { width: 20px; height: 20px; }
  #mapcv { width: 100%; height: 46vh; display: block; background: #0f0a06; border: 1px solid var(--line); border-radius: 12px; touch-action: none; }
  .who { border-top: 1px solid var(--line); padding: 7px 0; }
  .who b { color: var(--gold); }
  .ev { padding: 4px 0; line-height: 1.5; }
  .mrow { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
  .mrow .chip { flex: none; }
  .msay { color: var(--gold); margin: 4px 0 6px; }
  .mlink { padding: 3px 0; cursor: pointer; }
  #mFind { width: 100%; margin: 6px 0; }
  #sMic { flex: none; min-width: 44px; padding: 7px 10px; }
  #sMic.on { background: #2fb8d8; color: #08131a; border-color: #2fb8d8; }
  #search header #q { min-width: 0; }
  .loc h3 { margin: 4px 0 6px; font-size: 15px; color: var(--gold); }
  .saidEn { color: var(--muted); font-size: 13.5px; margin: 2px 0 8px; }
  .mic { flex: none; }
  .mic.on { background: #2fb8d8 !important; color: #08131a !important; border-color: #2fb8d8 !important; }
  #vline { position: absolute; left: 12px; right: 12px; bottom: 74px; z-index: 13; background: rgba(12,28,34,.94); color: #d9f6ff; border: 1px solid #2fb8d8;
           border-radius: 14px; padding: 8px 12px; font-size: 15px; line-height: 1.45; text-align: center; pointer-events: none; }
  #hallbar { position: absolute; left: 8px; right: 8px; bottom: 34px; z-index: 4; display: flex; gap: 6px; justify-content: space-between; }
  #hallbar button { background: rgba(29,20,13,.95); border-color: var(--gold2); padding: 8px 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="t1"><button id="bClose" aria-label="మూసేయి">✕</button><div id="ttl">📚 Jarvis గ్రంథాలయం</div><button id="bMic" class="mic" aria-label="మాట్లాడండి">🎙️</button></div>
  <div class="t2"><button id="bView">🕰️ కాలం</button><button id="bMe" aria-label="నా చదువు">📊</button><button id="bTr" aria-label="అనువాదాలు">✨</button><button id="bSearch" aria-label="వెతుకు">🔍</button><button id="bAdd" aria-label="పుస్తకం పెట్టు">➕</button></div>
</div>
<div id="chips"></div>
<div id="hint">పుస్తకం మీద నొక్కండి · వేలితో జరపండి · రెండు వేళ్ళతో దగ్గరగా / దూరంగా</div>
<div id="aibar" hidden></div>
<div id="nowbar" hidden><span>🔊</span><span class="t" id="nowT"></span><button id="nowP">⏸</button><button id="nowR">📖</button><button id="nowS">🌙</button></div>

<div id="card" class="sheet" hidden></div>
<div id="add" class="sheet" hidden></div>
<div id="quote" class="sheet" hidden></div>
<div id="tool" class="sheet" hidden></div>
<div id="hallbar" hidden><button id="hPrev">◀ వెనకటి కాలం</button><button id="hOut">🚪 బయటకు</button><button id="hNext">తర్వాతి కాలం ▶</button></div>

<div id="search" class="panel" hidden>
  <header><button id="sBack">←</button><input id="q" type="search" placeholder="పుస్తకం / రచయిత పేరు (తెలుగు లేదా English)" enterkeyhint="search"><button id="sMic" aria-label="మాట్లాడి వెతుకు">🎤</button><button id="sGo" class="gold">🔍</button></header>
  <div class="body" id="sBody"></div>
</div>

<div id="trs" class="panel" hidden>
